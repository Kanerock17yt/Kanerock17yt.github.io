<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Game Cheats</title>
    <style>
        :root {
            --bg-1: #111827;
            --bg-2: #1f2937;
            --panel: rgba(17, 24, 39, 0.8);
            --text: #f8fafc;
            --muted: #cbd5e1;
            --accent: #8b5cf6;
            --accent-2: #22c55e;
            --border: rgba(148, 163, 184, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 32px 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
            color: var(--text);
        }

        .container {
            width: min(900px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
            padding: clamp(22px, 4vw, 42px);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: clamp(2rem, 4vw, 3rem);
        }

        .cheat-list {
            display: grid;
            gap: 20px;
        }

        .cheat-item {
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px 20px;
        }

        .cheat-item h2 {
            margin: 0 0 10px;
            font-size: 1.1rem;
            color: #ddd6fe;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
            font-size: 1rem;
        }

        code {
            display: inline-block;
            margin: 6px 0;
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(167, 139, 250, 0.4);
            color: #e9d5ff;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 0.95rem;
        }

        .tag {
            display: inline-block;
            padding: 0.32rem 0.68rem;
            margin-bottom: 10px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.18);
            border: 1px solid rgba(34, 197, 94, 0.4);
            font-size: 0.76rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #bbf7d0;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Website Game Cheats</h1>

        <div class="cheat-list">
            <div class="cheat-item">
                <div class="tag">Cookie Clicker</div>
                <h2>Infinite cookies</h2>
                <p>Open the browser console, then paste:</p>
                <code>Game.cookies = Infinity</code>
            </div>

            <div class="cheat-item">
                <div class="tag">Cookie Clicker</div>
                <h2>Admin panel</h2>
                <p>Add <code>saysopensesame</code> to the end of your bakery name, press enter, then refresh the page. A little admin panel button should appear.</p>
            </div>
        </div>
    </div>

    <!-- Make sure to include crypto-js on your page if not already loaded: -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script type="module" src="./assets/scripts/log-visit.js"></script>
</body>
</html>
